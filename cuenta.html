<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Regístrate o inicia sesión en Agropedia.">
  <title>Cuenta | Agropedia</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/usuarios.css">
</head>
<body>
<header class="navbar"><div class="navbar-container">
  <a href="index.html" class="logo"><img src="assets/images/logo.png" alt="Agropedia"></a>
  <nav class="main-navigation"><a href="index.html">Inicio</a><a href="plantas.html">Plantas</a><a href="aprende.html">Aprende</a><a href="nosotros.html">Nosotros</a></nav>
  <nav class="user-navigation"><a href="cuenta.html" class="active">Iniciar sesión</a><a href="mi-jardin.html">Mi jardín</a><a href="perfil.html">Perfil</a></nav>
</div></header>
<main class="account-page section-container">
  <section class="account-card">
    <div class="account-intro"><span class="eyebrow">AGROPEDIA</span><h1>Tu jardín, contigo.</h1><p>Guarda tus plantas favoritas, organiza tus bancales y adapta Agropedia a tu región.</p></div>
    <div class="auth-tabs"><button class="auth-tab active" data-tab="login">Iniciar sesión</button><button class="auth-tab" data-tab="register">Crear cuenta</button></div>
    <form id="loginForm" class="auth-form">
      <label>Correo electrónico<input type="email" id="loginEmail" required autocomplete="email"></label>
      <label>Contraseña<input type="password" id="loginPassword" required autocomplete="current-password"></label>
      <button class="primary-button" type="submit">Entrar</button><p id="loginMessage" class="form-message"></p>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <label>Nombre<input type="text" id="registerName" required autocomplete="name"></label>
      <label>Nombre de usuario<input type="text" id="registerUsername" required autocomplete="username" minlength="3"></label>
      <label>Correo electrónico<input type="email" id="registerEmail" required autocomplete="email"></label>
      <label>Contraseña<input type="password" id="registerPassword" required autocomplete="new-password" minlength="6"></label>
      <div class="region-notice"><strong>Región inicial</strong><span>Centro de México</span><small>Podrás cambiar tu región después desde tu perfil.</small></div>
      <button class="primary-button" type="submit">Crear mi cuenta</button><p id="registerMessage" class="form-message"></p>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script>
</body></html>
