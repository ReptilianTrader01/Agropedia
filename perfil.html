<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi perfil | Agropedia</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/usuarios.css"></head>
<body>
<header class="navbar"><div class="navbar-container"><a href="index.html" class="logo"><img src="assets/images/logo.png" alt="Agropedia"></a><nav class="main-navigation"><a href="index.html">Inicio</a><a href="plantas.html">Plantas</a><a href="aprende.html">Aprende</a><a href="nosotros.html">Nosotros</a></nav><nav class="user-navigation"><a href="cuenta.html">Cuenta</a><a href="mi-jardin.html">Mi jardín</a><a href="perfil.html" class="active">Perfil</a></nav></div></header>
<main class="user-page section-container"><section class="page-heading"><span class="eyebrow">MI PERFIL</span><h1>Personaliza Agropedia</h1><p>Tu región ayuda a adaptar las recomendaciones de cultivo y las condiciones de tu jardín.</p></section>
<section class="profile-grid"><article class="user-card profile-summary"><div class="avatar" id="profileAvatar">🌱</div><h2 id="profileUsername">Cargando...</h2><p id="profileEmail"></p><button id="logoutButton" class="secondary-button">Cerrar sesión</button></article>
<form id="profileForm" class="user-card preferences-form"><h2>Preferencias</h2><label>Nombre de usuario<input id="username" type="text" minlength="3" required></label><label>Nombre<input id="nombre" type="text"></label><label>Región<select id="region"><option>Centro de México</option><option>Norte de México</option><option>Occidente de México</option><option>Golfo de México</option><option>Sur de México</option><option>Sureste de México</option><option>Otra región</option></select></label><div class="two-columns"><label>Estado<input id="estado" type="text"></label><label>Ciudad<input id="ciudad" type="text"></label></div><label>Zona horaria<input id="zonaHoraria" type="text" value="America/Mexico_City"></label><label class="check-row"><input id="preferenciaLunar" type="checkbox"> Mostrar recomendaciones basadas en fases lunares</label><button class="primary-button" type="submit">Guardar preferencias</button><p id="profileMessage" class="form-message"></p></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/perfil.js"></script><script src="js/main.js"></script>
</body></html>
